<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RnB Network Notes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* gray-100 */
            -webkit-tap-highlight-color: transparent;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .note-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .note-card:active {
            transform: scale(0.98);
        }

        /* Styling for Fake Inputs (contenteditable) */
        [contenteditable="true"] {
            cursor: text;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        [contenteditable="true"]:focus {
            outline: none;
        }
        
        /* Bulletproof placeholder logic for contenteditable */
        .show-placeholder:before {
            content: attr(data-placeholder);
            color: #d1d5db; /* tailwind gray-300 */
            pointer-events: none;
            display: block;
            position: absolute;
        }

        /* Modal transitions */
        .modal-enter {
            opacity: 0;
            transform: scale(0.95) translateY(10px);
        }
        .modal-enter-active {
            opacity: 1;
            transform: scale(1) translateY(0);
            transition: opacity 300ms, transform 300ms;
        }
        .modal-exit {
            opacity: 1;
            transform: scale(1) translateY(0);
        }
        .modal-exit-active {
            opacity: 0;
            transform: scale(0.95) translateY(10px);
            transition: opacity 200ms, transform 200ms;
        }

        /* Floating action button pulse */
        @keyframes subtlePulse {
            0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(59, 130, 246, 0); }
            100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
        }
        .fab:hover {
            animation: subtlePulse 1.5s infinite;
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-white shadow-sm z-10 px-4 py-4 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-2">
            <div class="bg-blue-500 text-white p-3 rounded-lg flex items-center justify-center">
                <i class="fa-solid fa-book text-xl"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight text-gray-900 hidden sm:block">RnB Network Notes</h1>
        </div>
        
        <!-- Action Buttons for Local Storage (Export/Import) -->
        <div class="flex items-center gap-2">
            <button type="button" onclick="triggerImport()" class="flex items-center gap-1.5 text-sm font-medium text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-100 hover:bg-emerald-100 transition-colors">
                <i class="fa-solid fa-upload"></i> Buka
            </button>
            <button type="button" onclick="exportData()" class="flex items-center gap-1.5 text-sm font-medium text-blue-600 bg-blue-50 px-3 py-1.5 rounded-full border border-blue-100 hover:bg-blue-100 transition-colors">
                <i class="fa-solid fa-download"></i> Simpan
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6 pb-24" id="mainContainer">
        <!-- Empty State -->
        <div id="emptyState" class="hidden flex-col items-center justify-center h-full text-gray-400">
            <i class="fa-regular fa-file-lines text-6xl mb-4 text-gray-300"></i>
            <p class="text-lg font-medium text-gray-600">Belum ada catatan</p>
            <p class="text-sm text-center max-w-xs mt-1">Tekan tombol + di bawah untuk membuat catatan pertama Anda.</p>
        </div>

        <!-- Notes Grid -->
        <div id="notesGrid" class="hidden grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 items-start">
            <!-- Notes will be injected here -->
        </div>
    </main>

    <!-- Floating Action Button -->
    <button type="button" id="fabAdd" onclick="openNoteModal()" class="fab fixed bottom-6 right-6 sm:bottom-8 sm:right-8 bg-blue-600 hover:bg-blue-700 text-white w-14 h-14 rounded-full shadow-lg shadow-blue-600/30 flex items-center justify-center text-2xl transition-colors z-20 focus:outline-none focus:ring-4 focus:ring-blue-300">
        <i class="fa-solid fa-plus"></i>
    </button>

    <!-- Note Editor Modal Overlay -->
    <div id="modalOverlay" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300 flex items-end sm:items-center justify-center">
        
        <!-- Modal Content -->
        <div id="noteModal" class="bg-white w-full sm:w-[500px] h-[85vh] sm:h-[600px] max-h-[100vh] sm:rounded-2xl rounded-t-2xl shadow-2xl flex flex-col transform translate-y-full transition-transform duration-300">
            
            <!-- Modal Header -->
            <div class="flex items-center justify-between px-4 py-3 border-b border-gray-100 shrink-0">
                <button type="button" onclick="closeNoteModal()" class="p-2 text-gray-400 hover:text-gray-700 hover:bg-gray-100 rounded-full transition-colors flex items-center justify-center w-8 h-8">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
                <span id="modalModeTitle" class="font-medium text-gray-600 text-sm">Catatan Baru</span>
                <button type="button" id="btnSave" onclick="saveNote()" class="px-4 py-1.5 bg-blue-50 text-blue-600 font-semibold rounded-full hover:bg-blue-100 transition-colors flex items-center gap-1">
                    <i class="fa-solid fa-circle-check"></i> Simpan
                </button>
            </div>

            <!-- Modal Body (NO INPUTS/TEXTAREAS HERE) -->
            <div class="flex-1 flex flex-col p-4 sm:p-6 overflow-y-auto relative">
                
                <!-- Fake Input: Title -->
                <div contenteditable="true" 
                     id="noteTitle" 
                     data-placeholder="Judul Catatan..." 
                     class="w-full text-2xl font-bold text-gray-800 border-none outline-none focus:ring-0 mb-4 bg-transparent relative empty-placeholder"
                     oninput="handlePlaceholder(this)"></div>
                
                <!-- Fake Input: Content -->
                <div contenteditable="true" 
                     id="noteContent" 
                     data-placeholder="Mulai mengetik di sini..." 
                     class="w-full flex-1 text-gray-600 border-none outline-none focus:ring-0 text-base leading-relaxed bg-transparent relative empty-placeholder"
                     oninput="handlePlaceholder(this)"></div>
                     
            </div>

            <!-- Modal Footer (For Actions like Delete) -->
            <div id="modalFooter" class="px-4 py-3 border-t border-gray-50 shrink-0 flex justify-between items-center bg-gray-50 rounded-b-2xl hidden">
                <span id="noteTimestamp" class="text-xs text-gray-400"></span>
                <!-- Kept for formatting consistency, though deleting is now on the card -->
                <div class="text-xs text-gray-400"><i class="fa-solid fa-cloud-arrow-down mr-1"></i>Tersimpan Lokal</div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full shadow-lg text-sm transition-all duration-300 opacity-0 pointer-events-none z-50 translate-y-[-20px]">
        Notification message
    </div>

    <!-- Core Logic: Local Storage & JSON Export/Import -->
    <script>
        const STORAGE_KEY = 'myNotesData';
        let notesData = [];
        let currentEditId = null; // Global ID tracking (Replacing hidden input)

        // UI Elements
        const emptyState = document.getElementById('emptyState');
        const notesGrid = document.getElementById('notesGrid');
        const modalOverlay = document.getElementById('modalOverlay');
        const noteModal = document.getElementById('noteModal');
        const modalModeTitle = document.getElementById('modalModeTitle');
        const modalFooter = document.getElementById('modalFooter');
        const noteTimestamp = document.getElementById('noteTimestamp');
        
        // Fake Inputs
        const titleInput = document.getElementById('noteTitle');
        const contentInput = document.getElementById('noteContent');

        // Handles placeholder visibility for contenteditable elements
        window.handlePlaceholder = (el) => {
            if (el.innerText.trim() === '') {
                el.classList.add('show-placeholder');
                // clear br tags added by browsers when empty
                if (el.innerHTML !== '') el.innerHTML = '';
            } else {
                el.classList.remove('show-placeholder');
            }
        };

        // Initialize Data
        function initApp() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    notesData = JSON.parse(stored);
                } catch (e) {
                    notesData = [];
                }
            }
            renderNotes();
        }

        function renderNotes() {
            // Sort newest first
            notesData.sort((a, b) => b.updatedAt - a.updatedAt);
            
            if (notesData.length === 0) {
                emptyState.classList.remove('hidden');
                notesGrid.classList.add('hidden');
                notesGrid.innerHTML = '';
            } else {
                emptyState.classList.add('hidden');
                notesGrid.classList.remove('hidden');
                
                let html = '';
                notesData.forEach(note => {
                    const title = note.title ? escapeHtml(note.title) : 'Tanpa Judul';
                    const contentSnippet = note.content ? escapeHtml(note.content) : 'Tidak ada konten...';
                    const dateStr = note.updatedAt ? new Date(note.updatedAt).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
                    
                    html += `
                        <div onclick="editNote('${note.id}')" class="note-card bg-white p-5 rounded-2xl shadow-sm border border-gray-100 cursor-pointer hover:shadow-md hover:border-blue-200 group flex flex-col h-full min-h-[140px] relative">
                            <h3 class="font-bold text-gray-800 text-lg mb-2 pr-10 line-clamp-1 group-hover:text-blue-600 transition-colors">${title}</h3>
                            <p class="text-gray-500 text-sm leading-relaxed line-clamp-3 mb-4 flex-1 whitespace-pre-wrap">${contentSnippet}</p>
                            <div class="mt-auto pt-3 border-t border-gray-50 flex justify-between items-center text-xs text-gray-400">
                                <span>${dateStr}</span>
                            </div>
                            
                            <!-- Tombol Hapus Langsung di Card (2-step verification) -->
                            <button type="button" onclick="handleCardDelete(event, '${note.id}')" id="delBtn_${note.id}" class="absolute top-3 right-3 p-1.5 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all focus:opacity-100 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 flex items-center gap-1 z-10" title="Hapus catatan">
                                <i class="fa-solid fa-trash text-lg"></i>
                                <span class="text-xs font-bold hidden del-text">Yakin?</span>
                            </button>
                        </div>
                    `;
                });
                notesGrid.innerHTML = html;
            }
        }

        window.handleCardDelete = (event, id) => {
            event.stopPropagation(); // Mencegah modal edit terbuka saat klik tombol hapus
            const btn = document.getElementById(`delBtn_${id}`);
            const textSpan = btn.querySelector('.del-text');

            if (!btn.dataset.confirm) {
                // Klik pertama: Minta konfirmasi (Ubah ke warna merah)
                btn.dataset.confirm = 'true';
                btn.classList.remove('text-gray-400', 'sm:opacity-0');
                btn.classList.add('text-red-600', 'bg-red-100', 'opacity-100');
                textSpan.classList.remove('hidden');

                // Batal otomatis setelah 3 detik jika tidak diklik lagi
                setTimeout(() => {
                    if (document.getElementById(`delBtn_${id}`) && btn.dataset.confirm) {
                        btn.dataset.confirm = '';
                        btn.classList.remove('text-red-600', 'bg-red-100', 'opacity-100');
                        btn.classList.add('text-gray-400', 'sm:opacity-0');
                        textSpan.classList.add('hidden');
                    }
                }, 3000);
            } else {
                // Klik kedua: Hapus permanen dari penyimpanan
                notesData = notesData.filter(n => n.id !== id);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(notesData));
                showToast("Catatan berhasil dihapus");
                renderNotes();
            }
        };

        // --- CRUD Operations ---
        window.saveNote = () => {
            // Read from innerText to preserve formatting
            const title = titleInput.innerText.trim();
            const content = contentInput.innerText.trim();
            
            if (!title && !content) {
                closeNoteModal();
                return;
            }

            const now = Date.now();
            
            if (currentEditId) {
                // Update
                const index = notesData.findIndex(n => n.id === currentEditId);
                if (index !== -1) {
                    notesData[index] = { ...notesData[index], title, content, updatedAt: now };
                    showToast("Catatan diperbarui");
                }
            } else {
                // Create
                const newNote = {
                    id: 'note_' + now + '_' + Math.random().toString(36).substr(2, 5),
                    title,
                    content,
                    createdAt: now,
                    updatedAt: now
                };
                notesData.push(newNote);
                showToast("Catatan disimpan");
            }

            localStorage.setItem(STORAGE_KEY, JSON.stringify(notesData));
            renderNotes();
            closeNoteModal();
        };

        window.editNote = (id) => {
            const note = notesData.find(n => n.id === id);
            if (note) {
                openNoteModal(note);
            }
        };

        // --- Export / Import Logic (JSON Implementation) ---
        window.exportData = () => {
            if (notesData.length === 0) {
                showToast("Tidak ada catatan untuk disimpan.");
                return;
            }
            const dataStr = JSON.stringify(notesData, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `RnB-Notes-Backup-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showToast("Berhasil menyimpan notes.json");
        };

        window.triggerImport = () => {
            // Dynamically construct input to keep HTML 100% free from inputs
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = '.json';
            
            fileInput.onchange = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        if (Array.isArray(importedData)) {
                            notesData = importedData;
                            localStorage.setItem(STORAGE_KEY, JSON.stringify(notesData));
                            renderNotes();
                            showToast("Berhasil memulihkan catatan!");
                        } else {
                            showToast("Format file JSON tidak valid.");
                        }
                    } catch (error) {
                        console.error("Import error:", error);
                        showToast("Gagal memproses file.");
                    }
                };
                reader.readAsText(file);
            };
            
            // Programmatically open file dialog
            fileInput.click();
        };

        // --- UI Interactions ---
        function openNoteModal(note = null) {
            if (note) {
                currentEditId = note.id;
                titleInput.innerText = note.title || '';
                contentInput.innerText = note.content || '';
                modalModeTitle.textContent = "Edit Catatan";
                modalFooter.classList.remove('hidden');
                
                if(note.updatedAt) {
                    const date = new Date(note.updatedAt);
                    noteTimestamp.textContent = "Diubah: " + date.toLocaleDateString('id-ID') + " " + date.toLocaleTimeString('id-ID', {hour: '2-digit', minute:'2-digit'});
                }
            } else {
                currentEditId = null;
                titleInput.innerText = '';
                contentInput.innerText = '';
                modalModeTitle.textContent = "Catatan Baru";
                modalFooter.classList.add('hidden');
            }
            
            // Check placeholders
            handlePlaceholder(titleInput);
            handlePlaceholder(contentInput);

            modalOverlay.classList.remove('hidden');
            void modalOverlay.offsetWidth; // Reflow
            modalOverlay.classList.remove('opacity-0');
            modalOverlay.classList.add('opacity-100');
            
            noteModal.classList.remove('translate-y-full');
            noteModal.classList.add('translate-y-0');

            setTimeout(() => {
                if(note && note.title) contentInput.focus();
                else titleInput.focus();
            }, 300);
            
            document.body.style.overflow = 'hidden';
        }

        function closeNoteModal() {
            modalOverlay.classList.remove('opacity-100');
            modalOverlay.classList.add('opacity-0');
            noteModal.classList.remove('translate-y-0');
            noteModal.classList.add('translate-y-full');

            setTimeout(() => {
                modalOverlay.classList.add('hidden');
                document.body.style.overflow = '';
            }, 300);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
            }, 3000);
        }

        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // Start App
        initApp();
    </script>
</body>
</html>
